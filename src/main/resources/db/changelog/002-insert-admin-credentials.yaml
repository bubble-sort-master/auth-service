databaseChangeLog:
  - changeSet:
      id: 2
      author: gleb elopov
      changes:
        - insert:
            tableName: user_credentials
            columns:
              - column:
                  name: id
                  valueNumeric: 1
              - column:
                  name: user_id
                  valueNumeric: 1
              - column:
                  name: username
                  value: "admin"
              - column:
                  name: password
                  value: "$2a$12$s7.scFQ1xRXONkSY.MSkiOa.HXrOXV3NPJKBKfPPjV5FXeTKK9H5W"
              - column:
                  name: role
                  value: "ADMIN"
              - column:
                  name: created_at
                  valueComputed: CURRENT_DATE
              - column:
                  name: updated_at
                  valueComputed: CURRENT_DATE
      rollback:
        - delete:
            tableName: user_credentials
            where: "id = 1"
  - changeSet:
      id: 3
      author: gleb elopov
      changes:
        - sql:
            sql: "SELECT setval('user_credentials_id_seq', (SELECT MAX(id) FROM user_credentials));"
      rollback:
        - sql:
            sql: "SELECT setval('user_credentials_id_seq', 1);"